{% include 'header.html' %}
<body style="background-color: #f8f9fa;">
  <div class="container mt-5 mb-5">
    
    <div class="row justify-content-center mt-4">
      <div class="col-md-10">
        <div class="card shadow-sm" style="border-radius: 8px; border: none;">
          <div class="card-header text-white" style="background-color: #5bc0de; border-radius: 8px 8px 0 0;">
            <h5 class="mb-0">Tambah Data Mobil Baru</h5>
          </div>
          <div class="card-body bg-white">
            <form role="form" action="{{url_for('createcarsave')}}" method="POST">
                <div class="form-group">
                    <label class="font-weight-bold text-muted">Nama Mobil</label>
                    <input type="text" class="form-control" name="carName" required style="border-radius: 4px; background-color: #f8f9fa;">
                </div>
                <div class="form-group">
                    <label class="font-weight-bold text-muted">Brand</label>
                    <input type="text" class="form-control" name='carBrand' required style="border-radius: 4px; background-color: #f8f9fa;">
                </div>
                <div class="form-group">
                    <label class="font-weight-bold text-muted">Model</label>
                    <input type="text" class="form-control" name="carModel" required style="border-radius: 4px; background-color: #f8f9fa;">
                </div>
                <div class="form-group">
                    <label class="font-weight-bold text-muted">Price</label>
                    <input type="text" class="form-control" name="carPrice" required style="border-radius: 4px; background-color: #f8f9fa;">
                </div>
                
                <!-- Layout Tombol: Kembali di Kiri Bawah, Simpan di Kanan Bawah -->
                <div class="d-flex justify-content-between align-items-center mt-5">
                  <a href="{{ url_for('readcar') }}" class="btn btn-outline-secondary px-4" style="border-radius: 4px; background-color: white;">
                    &lt; Kembali
                  </a>
                  <button type="submit" class="btn btn-info text-white px-5" style="border-radius: 4px; background-color: #5bc0de; border-color: #46b8da;">Simpan Data</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
{% include 'footer.html' %}
